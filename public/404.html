<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | WhoisDNS Web Tools</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0B0F17">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    .nf-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      min-height: 70vh;
      padding: var(--space-12) var(--space-4);
      text-align: center;
    }

    .nf-code {
      font-family: var(--font-mono);
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: 700;
      line-height: 1;
      color: var(--primitive-slate-700);
    }

    .nf-title {
      font-size: clamp(1.2rem, 2.5vw, 1.5rem);
      font-weight: 600;
      line-height: 1.3;
      color: var(--color-text-bright);
    }

    .nf-desc {
      max-width: 46ch;
      font-size: 0.875rem;
      line-height: 1.5;
      color: var(--color-text-muted);
    }

    .nf-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-2);
      margin-top: var(--space-2);
    }

    .nf-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 var(--space-6);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color var(--transition-fast), border-color var(--transition-fast);
    }

    .nf-btn-primary {
      border: 1px solid var(--primitive-sky-500);
      background-color: var(--primitive-sky-600);
      color: var(--primitive-white);
    }

    .nf-btn-primary:hover {
      background-color: var(--primitive-sky-500);
    }

    .nf-btn-ghost {
      border: 1px solid var(--color-border-strong);
      background-color: transparent;
      color: var(--color-text-main);
    }

    .nf-btn-ghost:hover {
      border-color: var(--color-border-interactive);
      color: var(--color-text-bright);
    }
  </style>
</head>
<body>
  <main class="nf-wrap">
    <p class="nf-code" aria-hidden="true">404</p>
    <h1 class="nf-title">Page not found</h1>
    <p class="nf-desc">The page you requested does not exist or has moved. Run a domain inspection instead.</p>
    <div class="nf-actions">
      <a class="nf-btn nf-btn-primary" href="/">Inspect a Domain</a>
      <a class="nf-btn nf-btn-ghost" href="/#about-section">About</a>
    </div>
  </main>
</body>
</html>
