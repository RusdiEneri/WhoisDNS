<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | WhoisDNS Web Tools</title>
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    .nf-wrap { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 3rem 1rem; gap: 1rem; }
    .nf-code { font-size: clamp(4rem, 14vw, 8rem); font-weight: 700; line-height: 1; color: var(--accent-cyan, #00E5FF); font-family: var(--font-mono, monospace); }
    .nf-title { font-size: 1.4rem; font-weight: 600; color: var(--text-primary, #F8FAFC); }
    .nf-desc { color: var(--text-muted, #94A3B8); max-width: 480px; line-height: 1.6; }
    .nf-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; margin-top: 0.5rem; }
    .nf-btn { padding: 0.7rem 1.4rem; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: opacity .2s; }
    .nf-btn:hover { opacity: .85; }
    .nf-btn-primary { background: var(--accent-cyan, #00E5FF); color: #05070D; }
    .nf-btn-ghost { border: 1px solid var(--color-border, rgba(255,255,255,.1)); color: var(--text-primary, #F8FAFC); }
  </style>
</head>
<body>
  <main class="nf-wrap">
    <div class="nf-code">404</div>
    <h1 class="nf-title">Page not found</h1>
    <p class="nf-desc">The page you are looking for doesn't exist or has been moved. Try inspecting a domain instead &mdash; that's what we do best.</p>
    <div class="nf-actions">
      <a class="nf-btn nf-btn-primary" href="/">Inspect a Domain</a>
      <a class="nf-btn nf-btn-ghost" href="/#about-section">About</a>
    </div>
  </main>
</body>
</html>
