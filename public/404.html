<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | WhoisDNS Web Tools</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#1a0f0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    .nf-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      min-height: 70vh;
      padding: var(--space-12) var(--space-4);
      text-align: center;
    }

    .nf-code {
      font-family: var(--font-display);
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: 700;
      line-height: 1;
      color: var(--primitive-hairline);
    }

    .nf-title {
      font-size: clamp(1.4rem, 2.5vw, 1.75rem);
      font-weight: 700;
      line-height: 1.3;
      color: var(--color-text-bright);
    }

    .nf-desc {
      max-width: 46ch;
      font-size: 1rem;
      line-height: 1.7;
      color: var(--color-text-muted);
    }

    .nf-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-2);
      margin-top: var(--space-2);
    }

    .nf-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 var(--space-6);
      border-radius: var(--radius-md);
      font-family: var(--font-display);
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background-color var(--transition-fast), border-color var(--transition-fast),
        box-shadow var(--transition-fast);
    }

    .nf-btn-primary {
      border: 1px solid var(--primitive-gold-light);
      background-color: var(--primitive-gold);
      color: var(--primitive-canvas);
      box-shadow: var(--shadow-sm);
    }

    .nf-btn-primary:hover {
      background-color: var(--primitive-gold-light);
      box-shadow: var(--shadow-md);
    }

    .nf-btn-ghost {
      border: 1px solid var(--primitive-gold);
      background-color: rgba(202, 138, 4, 0.08);
      color: var(--primitive-gold-light);
    }

    .nf-btn-ghost:hover {
      border-color: var(--primitive-gold-light);
      color: var(--color-text-bright);
    }
  </style>
</head>
<body>
  <main class="nf-wrap">
    <p class="nf-code" aria-hidden="true">404</p>
    <h1 class="nf-title">Page not found</h1>
    <p class="nf-desc">The page you requested does not exist or has moved. Run a domain inspection instead.</p>
    <div class="nf-actions">
      <a class="nf-btn nf-btn-primary" href="/">Inspect a Domain</a>
      <a class="nf-btn nf-btn-ghost" href="/#about-section">About</a>
    </div>
  </main>
</body>
</html>
